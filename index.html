<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBZ Database FR — Dokkan Battle × Dokkan Sparking</title>
<style>
:root{--bg:#060811;--panel:#101625;--line:#2c3953;--txt:#f8f9ff;--muted:#9ca8bf;--gold:#ffd83d;--agi:#168cff;--tec:#20c86a;--int:#a55cff;--pui:#ff4052;--end:#ffd21c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20294a,#060811 48%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#060811ee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.wrap{max-width:1900px;margin:auto;padding:18px 24px}.brand{display:flex;gap:14px;align-items:center}.logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#ffd21c,#ff6800);display:grid;place-items:center;color:#111;font-weight:1000;font-size:18px}h1{margin:0;font-size:clamp(22px,3vw,36px)}.sub{color:var(--muted);font-size:13px;margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{font:inherit;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{color:var(--gold);border-color:var(--gold)}
.controls{display:grid;grid-template-columns:1fr repeat(4,170px);gap:10px;margin-top:16px}.control{font:inherit;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:12px}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.badge{display:inline-block;font-size:11px;font-weight:900;padding:4px 8px;border-radius:7px;background:#202a40;border:1px solid #364662}.type{color:#fff;border:0;text-shadow:0 1px 3px #000}.agi{background:var(--agi)}.tec{background:var(--tec)}.int{background:var(--int)}.pui{background:var(--pui)}.end{background:var(--end);color:#17120a;text-shadow:none}
.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#0c111d;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:12px}.pill b{color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card{background:linear-gradient(180deg,#141b2b,#0d111c);border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:0 12px 35px #0006}.card:hover{transform:translateY(-5px)}
.art{aspect-ratio:1/1.18;display:grid;place-items:center;background:linear-gradient(145deg,#0b0f18,#171d2b);position:relative}.art:after{content:"DBZ";font-weight:1000;font-size:52px;opacity:.09;position:absolute}.symbol{font-size:72px;opacity:.25;z-index:1}.info{padding:13px}.name{font-weight:950;font-size:16px}.meta{color:var(--muted);font-size:12px;margin-top:6px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.dokkan{color:#ffe476;border-color:#6c5519;background:#281e08}.sparking{color:#d0b5ff;border-color:#6341a8;background:#24164a}
.empty{text-align:center;padding:70px;color:var(--muted)}footer{color:#71809a;font-size:12px;padding:38px 0}
.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:#0d1320;border:1px solid #3b4968;border-radius:20px;padding:22px}.close{float:right;background:#202a3d;color:#fff;border:0;border-radius:10px;padding:8px 12px}.detail{padding-top:10px}.detail h2{font-size:30px}.skill{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:12px;background:#111a2b;border:1px solid var(--line);border-radius:12px;text-align:center}.stat b{display:block;font-size:18px;color:var(--gold)}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.wrap{padding:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}}
</style></head>
<body>
<header><div class="wrap">
<div class="brand"><div class="logo">DB</div><div><h1>DBZ Database FR</h1><div class="sub">Dokkan Battle × Dokkan Sparking — interface française</div></div></div>
<nav><button class="tab active" data-game="all">Toutes les cartes</button><button class="tab" data-game="dokkan">Dokkan Battle</button><button class="tab" data-game="sparking">Dokkan Sparking</button></nav>
<div class="controls"><input id="search" class="control" placeholder="🔎 Rechercher un personnage ou une carte…"><select id="rarity" class="control"><option value="">Toutes les raretés</option><option>LR</option><option>UR</option><option>SP</option></select><select id="type" class="control"><option value="">Tous les types</option><option>AGI</option><option>TEC</option><option>INT</option><option>PUI</option><option>END</option></select><select id="classF" class="control"><option value="">Toutes les classes</option><option>Super</option><option>Extreme</option></select><select id="sort" class="control"><option value="az">Nom A → Z</option><option value="za">Nom Z → A</option></select></div>
<div class="legend"><span class="badge type agi">AGI — BLEU</span><span class="badge type tec">TEC — VERT</span><span class="badge type int">INT — VIOLET</span><span class="badge type pui">PUI — ROUGE</span><span class="badge type end">END — JAUNE</span></div>
<div class="stats"><span class="pill">Cartes affichées : <b id="count">0</b></span><span class="pill">Mode : <b id="mode">Toutes</b></span><span class="pill">Base locale : <b>V4</b></span></div>
</div></header>
<main class="wrap"><section id="grid" class="grid"></section><div id="empty" class="empty" hidden>Aucune carte ne correspond.</div><footer>Projet fan-made non affilié aux ayants droit de Dragon Ball.</footer></main>
<div id="modal" class="modal"><div class="dialog"><button id="close" class="close">Fermer</button><div id="detail"></div></div></div>
<script>
let cards=[];const S={game:"all",q:"",rarity:"",type:"",cls:"",sort:"az"},$=x=>document.getElementById(x);
const typeLabel=t=>t, typeClass=t=>t.toLowerCase();
async function init(){cards=await fetch("cards.json").then(r=>r.json());render()}
function render(){let a=cards.filter(x=>S.game==="all"||x.game===S.game);if(S.q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(S.q.toLowerCase()));if(S.rarity)a=a.filter(x=>x.rarity===S.rarity);if(S.type)a=a.filter(x=>x.type===S.type);if(S.cls)a=a.filter(x=>x.class===S.cls);a.sort((x,y)=>(S.sort==="az"?x.name.localeCompare(y.name):y.name.localeCompare(x.name)));$("count").textContent=a.length;$("mode").textContent=S.game==="all"?"Toutes":S.game==="dokkan"?"Dokkan Battle":"Dokkan Sparking";$("empty").hidden=a.length>0;$("grid").innerHTML=a.map((x,i)=>`<article class="card" data-i="${i}"><div class="art"><div class="symbol">✦</div></div><div class="info"><div class="name">${x.name}</div><div class="meta">${x.title}</div><div class="badges"><span class="badge ${x.game}">${x.game==="dokkan"?"DOKKAN BATTLE":"DOKKAN SPARKING"}</span><span class="badge">${x.rarity}</span><span class="badge type ${typeClass(x.type)}">${typeLabel(x.type)}</span><span class="badge">${x.class}</span></div></div></article>`).join("");document.querySelectorAll(".card").forEach((e,i)=>e.onclick=()=>detail(a[i]))}
function detail(x){$("detail").innerHTML=`<h2>${x.name}</h2><p>${x.title}</p><div class="badges"><span class="badge ${x.game}">${x.game==="dokkan"?"DOKKAN BATTLE":"DOKKAN SPARKING"}</span><span class="badge">${x.rarity}</span><span class="badge type ${typeClass(x.type)}">${x.type}</span><span class="badge">${x.class}</span></div><div class="statgrid"><div class="stat"><b>${x.stats[0]||"—"}</b>PV max.</div><div class="stat"><b>${x.stats[1]||"—"}</b>ATK max.</div><div class="stat"><b>${x.stats[2]||"—"}</b>DEF max.</div></div><div class="skill"><b>Leader Skill</b><p>${x.leader}</p></div><div class="skill"><b>Attaque spéciale</b><p>${x.sa}</p></div><div class="skill"><b>Compétence passive</b><p>${x.passive}</p></div><div class="skill"><b>Catégories</b><p>${x.categories.join(" • ")}</p></div><div class="skill"><b>Liens</b><p>${x.links.length?x.links.join(" • "):"—"}</p></div>`;$("modal").classList.add("open")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));b.classList.add("active");S.game=b.dataset.game;render()});
$("search").oninput=e=>{S.q=e.target.value;render()};$("rarity").onchange=e=>{S.rarity=e.target.value;render()};$("type").onchange=e=>{S.type=e.target.value;render()};$("classF").onchange=e=>{S.cls=e.target.value;render()};$("sort").onchange=e=>{S.sort=e.target.value;render()};$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("open")};init();
</script></body></html>
